name: scanova
description: "Numerisation intelligente des dossiers medicaux."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:

  google_mlkit_text_recognition: ^0.15.1
  google_mlkit_document_scanner: ^0.1.0
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  string_similarity: ^2.1.1
  camera: ^0.12.0+1
  image: ^4.5.4

  flutter:
    sdk: flutter
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.5

  # Impression / export PDF des documents (multi-pages + texte OCR).
  pdf: ^3.11.1
  printing: ^5.13.3


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/tessdata/
    - assets/tessdata_config.json

