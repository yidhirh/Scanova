name: Scanova CI/CD

on:
  push:
    branches: [ main, develop, bdd, yidhir ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Analyse · Test · Build APK
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code source
      - name: Checkout du code
        uses: actions/checkout@v4

      # 2. Installer Flutter (stable)
      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      # 3. Télécharger les dépendances pub
      - name: flutter pub get
        run: flutter pub get

      # 4. Analyse statique du code Dart
      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      # 5. Tests unitaires (parseurs CNI, Chifa, Bilan)
      - name: flutter test
        run: flutter test --coverage

      # 6. Build APK release
      - name: Build APK release
        run: flutter build apk --release --split-per-abi

      # 7. Publier l'APK comme artefact téléchargeable
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scanova-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  release:
    name: Créer une GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Uniquement sur un tag vX.Y.Z (ex: v1.0.0)
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Build APK release
        run: flutter build apk --release --split-per-abi

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
